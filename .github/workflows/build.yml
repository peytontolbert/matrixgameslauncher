name: Build and test launcher
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        shell: powershell
        run: ./build.ps1 -Test
      - uses: actions/upload-artifact@v4
        with:
          name: MatrixGamesLauncher-windows-x64
          path: build/MatrixGamesLauncher.exe
